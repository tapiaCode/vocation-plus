<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOCACIÓN+ | Carreras</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">VOCACIÓN<span class="logo-plus">+</span></a>
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Inicio</a>
        <a href="carreras.html" class="nav-link">Carreras</a>
        <a href="test.html" class="nav-link">Test</a>
        <a href="universidades.html" class="nav-link">Universidades</a>
        <a href="recursos.html" class="nav-link">Recursos</a>
        <a href="nosotros.html" class="nav-link">Contacto</a>
      </nav>
    </div>
  </header>

  <main class="container section">
    <div class="flex-between" style="margin-bottom: var(--space-xl);">
      <h1 class="title-page" style="margin-bottom: 0;">Carreras Universitarias</h1>
      <div class="search-container">
        <i class="ph ph-magnifying-glass search-icon"></i>
        <input type="text" class="search-input" placeholder="Buscar carrera...">
      </div>
    </div>

    <div class="careers-grid">
      <!-- Ingeniería -->
      <a href="#" class="career-card">
        <div class="career-icon-wrapper" style="color: #3B82F6; background: #EFF6FF;">
          <i class="ph-fill ph-gear"></i>
        </div>
        <span class="title-card">Ingeniería</span>
      </a>

      <!-- Medicina -->
      <a href="#" class="career-card">
        <div class="career-icon-wrapper" style="color: #EF4444; background: #FEF2F2;">
          <i class="ph-fill ph-heartbeat"></i>
        </div>
        <span class="title-card">Medicina</span>
      </a>

      <!-- Psicología -->
      <a href="#" class="career-card">
        <div class="career-icon-wrapper" style="color: #EC4899; background: #FDF2F8;">
          <i class="ph-fill ph-brain"></i>
        </div>
        <span class="title-card">Psicología</span>
      </a>

      <!-- Derecho -->
      <a href="#" class="career-card">
        <div class="career-icon-wrapper" style="color: #D97706; background: #FFFBEB;">
          <i class="ph-fill ph-scales"></i>
        </div>
        <span class="title-card">Derecho</span>
      </a>

      <!-- Arquitectura -->
      <a href="#" class="career-card">
        <div class="career-icon-wrapper" style="color: #2563EB; background: #EFF6FF;">
          <i class="ph-fill ph-buildings"></i>
        </div>
        <span class="title-card">Arquitectura</span>
      </a>

      <!-- Educación -->
      <a href="#" class="career-card">
        <div class="career-icon-wrapper" style="color: #10B981; background: #ECFDF5;">
          <i class="ph-fill ph-chalkboard-teacher"></i>
        </div>
        <span class="title-card">Educación</span>
      </a>

      <!-- Comunicación -->
      <a href="#" class="career-card">
        <div class="career-icon-wrapper" style="color: #8B5CF6; background: #F5F3FF;">
          <i class="ph-fill ph-megaphone"></i>
        </div>
        <span class="title-card">Comunicación</span>
      </a>

      <!-- Diseño Gráfico -->
      <a href="#" class="career-card">
        <div class="career-icon-wrapper" style="color: #F59E0B; background: #FFFBEB;">
          <i class="ph-fill ph-paint-brush-broad"></i>
        </div>
        <span class="title-card">Diseño Gráfico</span>
      </a>
    </div>
  </main>
</body>
</html>
